<div id="tip"></div>
<script>
  const tip = document.getElementById('tip');
  document.querySelectorAll('svg g rect').forEach(r => {
    const t = r.querySelector('title'); const text = t ? t.textContent : ''; if (t) t.remove();
    const m = text.match(/^(.*): ([\d.]+)% \((\d+) bytes\)(, linked)?$/);
    r.addEventListener('mousemove', e => {
      if (!m) return;
      tip.innerHTML = '<b></b><span></span>';
      tip.querySelector('b').textContent = m[1];
      tip.querySelector('span').textContent = m[2] + '% matched' + (m[4] ? ' \u2014 linked' : '') + ' \u00b7 ' +
        Number(m[3]).toLocaleString() + ' bytes of code';
      tip.style.display = 'block';
      const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
      const y = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    });
    r.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  });
</script>
